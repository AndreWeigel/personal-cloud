# Official Immich Docker Compose
# Docs: https://docs.immich.app/install/docker-compose
# Keep this in sync with: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml

name: immich

services:
  immich-server:
    container_name: immich_server
    labels:
      - 'wud.watch.digest=true'
      - 'wud.tag.include=^v\d+$$'
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      # Existing Nextcloud photo library, exposed read-only as an external library
      - /mnt/storagebox/nextcloud/Photos:/mnt/existing-photos:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Lock to localhost — Nginx handles external traffic
      - "127.0.0.1:2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    labels:
      - 'wud.watch.digest=true'
      - 'wud.tag.include=^v\d+$$'
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    environment:
      # v3.3.0+: optimized export of the same models — identical outputs, no re-run needed
      MACHINE_LEARNING_MODEL_REVISION: v2
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    labels:
      - 'wud.watch=false'
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    labels:
      - 'wud.watch=false'
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
