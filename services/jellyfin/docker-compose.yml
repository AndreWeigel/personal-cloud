services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: always
    # Run as root to avoid permission issues with Storage Box sshfs mounts
    user: root
    volumes:
      # App config and metadata cache — kept on VPS SSD for fast access
      - ./config:/config
      - ./cache:/cache
      # Media libraries on Storage Box — mounted read-only for security
      - /mnt/storagebox/jellyfin/movies:/media/movies:ro
      - /mnt/storagebox/jellyfin/tvshows:/media/tvshows:ro
    environment:
      # Jellyfin reads these for hardware info — not secret
      - JELLYFIN_PublishedServerUrl=https://media.yourdomain.com
    ports:
      # Localhost only — Nginx handles external traffic
      - "127.0.0.1:8096:8096"
    # Needed for sshfs mounts to be accessible inside the container
    devices: []
    security_opt:
      - no-new-privileges:true
