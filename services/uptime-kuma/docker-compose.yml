# Uptime Kuma — self-hosted uptime monitoring
# URL: status.yourdomain.com

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    labels:
      - 'wud.watch.digest=true'
      - 'wud.tag.include=^1$$'
    restart: always
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
