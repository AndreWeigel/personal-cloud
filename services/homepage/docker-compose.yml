# Homepage — one-page overview of every service on the box
# URL: https://home.andreweigel.me (behind nginx basic auth — see nginx/homepage.conf)
# Or via tunnel: ssh -L 3003:127.0.0.1:3003 -L 8085:127.0.0.1:8085 <server>
#   then http://localhost:3003  (the WUD tile links to localhost:8085, tunnel only)
#
# Homepage never touches the Docker socket. It talks to dockerproxy, which only
# forwards read-only container requests (list, inspect, stats). A `:ro` socket
# mount would NOT do that: it protects the socket file, not the API — anything
# holding the socket can create containers, i.e. root on the host.

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    labels:
      - 'wud.watch.digest=true'
      - 'wud.tag.include=^latest$$'
    restart: always
    volumes:
      - ./config:/app/config
    environment:
      # v1 rejects requests whose Host header isn't listed here.
      - HOMEPAGE_ALLOWED_HOSTS=home.andreweigel.me,localhost:3003,127.0.0.1:3003
      # Picked up from .env by Compose; used as {{HOMEPAGE_VAR_*}} in services.yaml.
      # Only these two are passed in, not the whole .env.
      - HOMEPAGE_VAR_WUD_USER=${WUD_AUTH_BASIC_ANDRE_USER}
      - HOMEPAGE_VAR_WUD_PASSWORD=${HOMEPAGE_WUD_PASSWORD}
    networks:
      - default
      - wud   # reach WUD's API at http://wud:3000 (it only listens on host 127.0.0.1)
    depends_on:
      - dockerproxy
    ports:
      - "127.0.0.1:3003:3000"

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-dockerproxy
    labels:
      - 'wud.watch.digest=true'
      - 'wud.tag.include=^latest$$'
    restart: always
    environment:
      # Allow only GET /containers/* (list, inspect, stats). POST defaults to 0,
      # so nothing can be created, started, stopped or exec'd through it.
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No ports: reachable only by Homepage on the compose default network.

networks:
  wud:
    external: true
    name: wud_default   # Compose project "wud" (deployed to ~/wud) — deploy WUD first
