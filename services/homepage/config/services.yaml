        href: https://photos.andreweigel.me
        icon: immich.png
        server: local
        container: immich_server
    - Jellyfin:
        href: https://media.andreweigel.me
        icon: jellyfin.png
        server: local
        container: jellyfin
    - Navidrome:
        href: https://music.andreweigel.me
        icon: navidrome.png
        server: local
        container: navidrome
    - Audiobookshelf:
        href: https://audiobooks.andreweigel.me
        icon: audiobookshelf.png
        server: local
        container: audiobookshelf
    - Calibre-Web:
        href: https://books.andreweigel.me
        icon: calibre-web.png
