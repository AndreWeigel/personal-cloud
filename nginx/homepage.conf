# Nginx config for Homepage (home.andreweigel.me)
# Port 80 only — certbot adds the 443 block (see scripts/ssl-setup.sh).
#
# Homepage has no login of its own and reads container status from the Docker
# socket, so it is never served without the basic-auth gate below.
# Create the password file once on the server:
#   printf 'andre:%s\n' "$(openssl passwd -apr1)" > /etc/nginx/.htpasswd-home

server {
    listen 80;
    server_name home.andreweigel.me;

    auth_basic "Homepage";
    auth_basic_user_file /etc/nginx/.htpasswd-home;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
