# Nginx config for Audiobookshelf (audiobooks.yourdomain.com)
# Replace yourdomain.com with your actual domain before using.

server {
    listen 80;
    server_name audiobooks.yourdomain.com;

    # Certbot will insert SSL redirect here

    # Allow large audiobook uploads through the web UI
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:13378;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (used for real-time UI updates and playback sync)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for audio streaming
        proxy_buffering off;

        # Extended timeout for large audiobook file transfers
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
