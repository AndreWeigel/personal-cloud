# Nginx config for Nextcloud (cloud.yourdomain.com)
# Replace yourdomain.com with your actual domain before using.
# After running certbot, it will automatically add the HTTPS (443) block.

server {
    listen 80;
    server_name cloud.yourdomain.com;

    # Certbot will insert the SSL redirect here when you run ssl-setup.sh

    # Allow large uploads (photos, videos, documents)
    client_max_body_size 10G;

    # Extended timeouts for large file uploads/downloads
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Nextcloud to generate correct URLs
        proxy_set_header X-Forwarded-Host $host;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;

        # Needed for CalDAV / CardDAV
        proxy_buffering off;
    }
}
