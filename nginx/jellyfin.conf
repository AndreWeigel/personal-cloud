# Nginx config for Jellyfin (media.yourdomain.com)
# Replace yourdomain.com with your actual domain before using.

server {
    listen 80;
    server_name media.yourdomain.com;

    # Certbot will insert SSL redirect here

    # Allow large file serving (movies can be multi-GB)
    client_max_body_size 20G;

    # Jellyfin-recommended proxy settings
    location / {
        proxy_pass http://127.0.0.1:8096;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Jellyfin to generate correct URLs
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (used for live TV, sync-play, dashboard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for media streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Extended timeouts for long-running streams
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
}
