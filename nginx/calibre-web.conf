# Nginx config for Calibre-Web (books.yourdomain.com)
# Replace yourdomain.com with your actual domain before using.

server {
    listen 80;
    server_name books.yourdomain.com;

    # Certbot will insert SSL redirect here

    # Allow ebook uploads (some files can be large)
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8083;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for large ebook downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
}
