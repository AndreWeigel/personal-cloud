# Nginx config for Immich (photos.yourdomain.com)
# Replace yourdomain.com with your actual domain before using.
# After running certbot, it will automatically add the HTTPS (443) block.

server {
    listen 80;
    server_name photos.yourdomain.com;

    # Certbot will insert the SSL redirect here when you run ssl-setup.sh

    # Allow large uploads (high-res photos and videos)
    client_max_body_size 50G;

    # Extended timeouts for large media uploads
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:2283;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (used by Immich for live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
