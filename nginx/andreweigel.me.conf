# Nginx config for the apex domain landing page (andreweigel.me + www)
# Static site served from /var/www/andreweigel.me
# Certbot adds the HTTPS (443) block + www→apex redirect when you run ssl-setup.sh

server {
    listen 80;
    server_name andreweigel.me www.andreweigel.me;

    root /var/www/andreweigel.me;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
