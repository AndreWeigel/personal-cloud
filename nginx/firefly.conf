# Nginx config for Firefly III + Data Importer.
# Two server blocks:
#   finance.yourdomain.com → Firefly III app        (localhost:8082)
#   import.yourdomain.com  → Firefly Data Importer   (localhost:8084)
# Replace yourdomain.com with your actual domain before using.
# Run ssl-setup.sh once per subdomain; certbot adds each HTTPS (443) block.

# ------------------------------------------------------------------
# Firefly III application
# ------------------------------------------------------------------
server {
    listen 80;
    server_name finance.yourdomain.com;

    # Certbot will insert the SSL redirect here when you run ssl-setup.sh

    # Allow reasonably large uploads (attachments, import files)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8082;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

# ------------------------------------------------------------------
# Firefly Data Importer
# ------------------------------------------------------------------
server {
    listen 80;
    server_name import.yourdomain.com;

    # Certbot will insert the SSL redirect here when you run ssl-setup.sh

    # Import files (CSV/config) can be a few MB
    client_max_body_size 100M;

    # The Data Importer has NO built-in login, so gate the whole vhost with
    # HTTP Basic Auth. Create the password file once on the server:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-firefly-importer <username>
    auth_basic           "Firefly Importer";
    auth_basic_user_file /etc/nginx/.htpasswd-firefly-importer;

    location / {
        proxy_pass http://127.0.0.1:8084;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
